<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>RAG 文件問答</title>
  <meta name="description" content="上傳 PDF / DOCX，選擇檢索策略，直接提問並查看引用片段">
  <meta name="theme-color" content="#2446B8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1420" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="文件問答">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">

  <!-- 設定面板：桌面為左側欄，手機為底部抽屜 -->
  <aside id="panel" class="panel" aria-label="設定" aria-hidden="false">
    <div class="panel-head">
      <span class="grab" aria-hidden="true"></span>
      <h2>設定</h2>
      <button id="closePanel" class="icon-btn only-mobile" type="button" aria-label="關閉設定">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <section class="field">
      <h3>文件</h3>
      <label id="drop" class="drop" for="fileInput">
        <input id="fileInput" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 17v-6m-3 3l3-3 3 3"/></svg>
        <span id="dropText">選擇或拖曳 PDF / DOCX</span>
      </label>
      <p id="docStatus" class="status" role="status">尚未載入文件</p>
    </section>

    <section class="field">
      <h3>檢索策略</h3>
      <div id="strategies" class="opts" role="radiogroup" aria-label="檢索策略"></div>
    </section>

    <section class="field">
      <h3>引用片段數量 <output id="topkOut" class="val">4</output></h3>
      <input id="topk" type="range" min="1" max="10" step="1" value="4" aria-label="引用片段數量">
    </section>

    <section class="field">
      <h3>模型</h3>
      <select id="model" aria-label="模型"></select>
    </section>

    <section class="field">
      <h3>Groq API Key</h3>
      <div class="keyrow">
        <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="gsk_…" aria-label="Groq API Key">
        <button id="keySave" class="btn ghost" type="button">驗證</button>
      </div>
      <p id="keyStatus" class="status">金鑰只存在這台裝置，隨每次提問送出，伺服器不保存。</p>
    </section>

    <section class="field" id="codeField" hidden>
      <h3>存取碼</h3>
      <input id="code" type="password" autocomplete="off" spellcheck="false" placeholder="英數字" aria-label="存取碼">
    </section>

    <section class="field">
      <label class="check"><input id="withSrc" type="checkbox" checked> <span>匯出 Word 時包含參考片段</span></label>
    </section>

    <section class="field">
      <button id="install" class="btn" type="button" hidden>安裝成 App</button>
      <p id="iosHint" class="status" hidden>在 Safari 點「分享」→「加入主畫面」即可安裝。</p>
    </section>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <!-- 對話區 -->
  <main class="chat">
    <header class="bar">
      <button id="openPanel" class="icon-btn only-mobile" type="button" aria-label="開啟設定" aria-controls="panel">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
      <div class="title">
        <strong id="docTitle">RAG 文件問答</strong>
        <small id="docMeta">上傳文件後開始提問</small>
      </div>
      <details id="menu" class="menu">
        <summary class="icon-btn" aria-label="更多動作">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        </summary>
        <div class="menu-pop" role="menu">
          <button type="button" role="menuitem" id="expDocx">匯出 Word</button>
          <button type="button" role="menuitem" id="expCsv">匯出 CSV</button>
          <button type="button" role="menuitem" id="clearChat" class="danger">清除對話</button>
        </div>
      </details>
    </header>

    <div id="banner" class="banner" role="status" hidden></div>

    <div id="log" class="log" role="log" aria-live="polite" aria-relevant="additions">
      <div id="thread" class="thread">
        <section id="empty" class="empty">
          <h1>上傳文件，開始提問</h1>
          <p>支援 PDF 與 DOCX。回答會標出引用的片段，點編號即可對照原文。</p>
          <button id="emptyUpload" class="btn" type="button">選擇文件</button>
          <div class="samples" aria-label="範例問題">
            <button type="button" class="chip">這份文件的重點是什麼？</button>
            <button type="button" class="chip">文件提到哪些規定或限制？</button>
            <button type="button" class="chip">有哪些風險或注意事項？</button>
          </div>
        </section>
      </div>
    </div>

    <form id="composer" class="composer" autocomplete="off">
      <textarea id="q" rows="1" placeholder="輸入問題" aria-label="輸入問題" enterkeyhint="send"></textarea>
      <button id="send" class="send" type="submit" aria-label="送出">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/app.js" defer></script>
</body>
</html>
